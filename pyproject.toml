[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tobiaszst-tail_latency_jitter_ratio_calc"
version = "0.1.0"
description = "从输入中抽取数值，计算实验管理与追踪工程师·尾延迟抖动与首 token 时间相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "tobiaszst" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://tobiaszst.github.io"
Repository = "https://github.com/tobiaszst/tail_latency_jitter_ratio_calc"
Issues = "https://github.com/tobiaszst/tail_latency_jitter_ratio_calc/issues"

[project.scripts]
tail_latency_jitter_ratio_calc = "tail_latency_jitter_ratio_calc:main"

[tool.setuptools]
py-modules = ["tail_latency_jitter_ratio_calc"]
